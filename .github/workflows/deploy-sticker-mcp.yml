name: Deploy Sticker MCP

on:
  push:
    branches:
      - main
    paths:
      - "supabase/**"
      - "tools/**"
      - ".github/workflows/deploy-sticker-mcp.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-sticker-mcp-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROJECT_ID: cqoevridrpdgqjyiksok
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check deployment secrets
        id: secrets
        shell: bash
        run: |
          if [[ -z "$SUPABASE_ACCESS_TOKEN" || -z "$SUPABASE_DB_PASSWORD" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Supabase deployment is prepared but paused. Add SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD in GitHub Actions secrets, then run this workflow again."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Link Supabase project
        if: steps.secrets.outputs.ready == 'true'
        run: supabase link --project-ref "$PROJECT_ID"

      - name: Apply database migrations
        if: steps.secrets.outputs.ready == 'true'
        run: supabase db push

      - name: Deploy Edge Function
        if: steps.secrets.outputs.ready == 'true'
        run: supabase functions deploy sticker-mcp --project-ref "$PROJECT_ID"

      - name: Verify public image
        if: steps.secrets.outputs.ready == 'true'
        run: |
          curl --fail --silent --show-error --location \
            --retry 5 --retry-all-errors --max-time 30 \
            "https://${PROJECT_ID}.supabase.co/storage/v1/object/public/stickers/funny/control.png" \
            --output /tmp/control.png
          test -s /tmp/control.png

      - name: Verify Edge Function health endpoint
        if: steps.secrets.outputs.ready == 'true'
        run: |
          curl --fail --silent --show-error --location \
            --retry 8 --retry-all-errors --retry-delay 3 --max-time 30 \
            "https://${PROJECT_ID}.supabase.co/functions/v1/sticker-mcp"
