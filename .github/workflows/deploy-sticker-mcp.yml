name: Deploy Sticker MCP

on:
  push:
    branches:
      - main
    paths:
      - "supabase/**"
      - "tools/**"
      - ".github/workflows/deploy-sticker-mcp.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-sticker-mcp-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROJECT_ID: cqoevridrpdgqjyiksok
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check deployment secrets
        id: secrets
        shell: bash
        run: |
          if [[ -z "$SUPABASE_ACCESS_TOKEN" || -z "$SUPABASE_DB_PASSWORD" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Supabase deployment is prepared but paused. Add SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD in GitHub Actions secrets, then run this workflow again."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Link Supabase project
        if: steps.secrets.outputs.ready == 'true'
        run: supabase link --project-ref "$PROJECT_ID"

      - name: Apply database migrations
        if: steps.secrets.outputs.ready == 'true'
        run: supabase db push

      - name: Import sticker URL batches
        if: steps.secrets.outputs.ready == 'true'
        shell: bash
        run: |
          api_keys_json="$(supabase projects api-keys \
            --project-ref "$PROJECT_ID" --reveal --output json)"
          service_role_key="$(jq -er \
            '.[] | select(.name == "service_role") | .api_key' \
            <<<"$api_keys_json")"
          echo "::add-mask::$service_role_key"
          SUPABASE_SERVICE_ROLE_KEY="$service_role_key" \
            python3 tools/import_url_batch.py

      - name: Deploy Edge Function
        if: steps.secrets.outputs.ready == 'true'
        run: supabase functions deploy sticker-mcp --project-ref "$PROJECT_ID"

      - name: Verify Edge Function health endpoint
        if: steps.secrets.outputs.ready == 'true'
        run: |
          curl --fail --silent --show-error --location \
            --retry 8 --retry-all-errors --retry-delay 3 --max-time 30 \
            "https://${PROJECT_ID}.supabase.co/functions/v1/sticker-mcp"

      - name: Verify MCP initialize handshake
        if: steps.secrets.outputs.ready == 'true'
        run: |
          response_file="$(mktemp)"
          curl --fail --silent --show-error --location \
            --retry 5 --retry-all-errors --retry-delay 3 --max-time 45 \
            --request POST \
            --header "Content-Type: application/json" \
            --header "Accept: application/json, text/event-stream" \
            --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"github-actions-smoke-test","version":"1.0.0"}}}' \
            "https://${PROJECT_ID}.supabase.co/functions/v1/sticker-mcp/mcp" \
            --output "$response_file"
          grep -Eq '"protocolVersion"|"serverInfo"' "$response_file"
          grep -q 'final_markdown' "$response_file"

      - name: Verify send_sticker descriptor contract
        if: steps.secrets.outputs.ready == 'true'
        run: |
          response_file="$(mktemp)"
          curl --fail --silent --show-error --location \
            --retry 5 --retry-all-errors --retry-delay 3 --max-time 45 \
            --request POST \
            --header "Content-Type: application/json" \
            --header "Accept: application/json, text/event-stream" \
            --data '{"jsonrpc":"2.0","id":11,"method":"tools/list","params":{}}' \
            "https://${PROJECT_ID}.supabase.co/functions/v1/sticker-mcp/mcp" \
            --output "$response_file"
          grep -q 'send_sticker' "$response_file"
          grep -q 'outputSchema' "$response_file"
          grep -q 'final_markdown' "$response_file"
          grep -q 'ui://sticker-mcp/sticker-v4.html' "$response_file"
          grep -q 'inspect_pending_sticker' "$response_file"
          grep -q 'save_sticker_metadata' "$response_file"

      - name: Verify Storage auto-registration and metadata enrichment
        if: steps.secrets.outputs.ready == 'true'
        shell: bash
        run: |
          api_keys_json="$(supabase projects api-keys \
            --project-ref "$PROJECT_ID" --reveal --output json)"
          service_role_key="$(jq -er \
            '.[] | select(.name == "service_role") | .api_key' \
            <<<"$api_keys_json")"
          echo "::add-mask::$service_role_key"

          object_path='smoke/auto_sync_test.png'
          object_url="https://${PROJECT_ID}.supabase.co/storage/v1/object/stickers/${object_path}"
          public_url="https://${PROJECT_ID}.supabase.co/storage/v1/object/public/stickers/${object_path}"
          sticker_id="st_auto_$(printf 'stickers:%s' "$object_path" | md5sum | cut -c1-20)"
          auth_headers=(
            --header "apikey: $service_role_key"
            --header "Authorization: Bearer $service_role_key"
          )

          cleanup() {
            curl --silent --show-error --request DELETE \
              "${auth_headers[@]}" "$object_url" >/dev/null || true
          }
          trap cleanup EXIT
          cleanup

          image_file="$(mktemp)"
          printf '%s' \
            'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVQIHWP4z8DwHwAFgAI/ScL9WQAAAABJRU5ErkJggg==' \
            | base64 --decode > "$image_file"
          curl --fail --silent --show-error \
            --request POST "${auth_headers[@]}" \
            --header 'Content-Type: image/png' \
            --header 'x-upsert: true' \
            --data-binary "@$image_file" \
            "$object_url" >/dev/null

          catalog_file="$(mktemp)"
          curl --fail --silent --show-error "${auth_headers[@]}" \
            "https://${PROJECT_ID}.supabase.co/rest/v1/sticker_catalog?id=eq.${sticker_id}&select=id,public_url,metadata_status,assistant_enabled,auto_registered" \
            --output "$catalog_file"
          grep -q "$sticker_id" "$catalog_file"
          grep -q "$public_url" "$catalog_file"
          grep -q '"metadata_status":"pending"' "$catalog_file"
          grep -q '"assistant_enabled":false' "$catalog_file"
          grep -q '"auto_registered":true' "$catalog_file"

          metadata_payload="$(jq -nc --arg id "$sticker_id" \
            '{jsonrpc:"2.0",id:31,method:"tools/call",params:{name:"save_sticker_metadata",arguments:{sticker_id:$id,ocr_text:"",visual_description:"自动同步烟测用的一像素透明图片",semantic_intent:"验证新上传图片可以自动登记并完成元数据写回",tone_tags:["测试","中性"],use_intents:["部署烟测"],avoid_when:["正常聊天"],confidence:1,is_adult:false}}}')"
          metadata_response="$(mktemp)"
          curl --fail --silent --show-error --location \
            --retry 5 --retry-all-errors --retry-delay 3 --max-time 60 \
            --request POST \
            --header "Content-Type: application/json" \
            --header "Accept: application/json, text/event-stream" \
            --data "$metadata_payload" \
            "https://${PROJECT_ID}.supabase.co/functions/v1/sticker-mcp/mcp" \
            --output "$metadata_response"
          grep -q '"saved":true' "$metadata_response"
          grep -q '"metadata_status":"ready"' "$metadata_response"

          cleanup
          deleted_file="$(mktemp)"
          curl --fail --silent --show-error "${auth_headers[@]}" \
            "https://${PROJECT_ID}.supabase.co/rest/v1/sticker_catalog?id=eq.${sticker_id}&select=metadata_status,assistant_enabled" \
            --output "$deleted_file"
          grep -q '"metadata_status":"deleted"' "$deleted_file"
          grep -q '"assistant_enabled":false' "$deleted_file"
          trap - EXIT

      - name: Verify search_stickers tool call
        if: steps.secrets.outputs.ready == 'true'
        run: |
          response_file="$(mktemp)"
          curl --fail --silent --show-error --location \
            --retry 5 --retry-all-errors --retry-delay 3 --max-time 45 \
            --request POST \
            --header "Content-Type: application/json" \
            --header "Accept: application/json, text/event-stream" \
            --data '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"search_stickers","arguments":{"query":"气呼呼，真的生气了","emotion":"生气","tone":"气呼呼","limit":5}}}' \
            "https://${PROJECT_ID}.supabase.co/functions/v1/sticker-mcp/mcp" \
            --output "$response_file"
          grep -q 'st_dog28_006' "$response_file"

      - name: Verify white-cat search result
        if: steps.secrets.outputs.ready == 'true'
        run: |
          response_file="$(mktemp)"
          curl --fail --silent --show-error --location \
            --retry 5 --retry-all-errors --retry-delay 3 --max-time 45 \
            --request POST \
            --header "Content-Type: application/json" \
            --header "Accept: application/json, text/event-stream" \
            --data '{"jsonrpc":"2.0","id":22,"method":"tools/call","params":{"name":"search_stickers","arguments":{"query":"疯狂摇头拒绝","emotion":"拒绝","tone":"搞怪","limit":5}}}' \
            "https://${PROJECT_ID}.supabase.co/functions/v1/sticker-mcp/mcp" \
            --output "$response_file"
          grep -q 'st_whitecat_001' "$response_file"

      - name: Verify 肥肥嘟 search result
        if: steps.secrets.outputs.ready == 'true'
        run: |
          response_file="$(mktemp)"
          curl --fail --silent --show-error --location \
            --retry 5 --retry-all-errors --retry-delay 3 --max-time 45 \
            --request POST \
            --header "Content-Type: application/json" \
            --header "Accept: application/json, text/event-stream" \
            --data '{"jsonrpc":"2.0","id":23,"method":"tools/call","params":{"name":"search_stickers","arguments":{"query":"胆子真是肥嘟嘟的，震惊呆住","emotion":"震惊","tone":"吐槽","limit":5}}}' \
            "https://${PROJECT_ID}.supabase.co/functions/v1/sticker-mcp/mcp" \
            --output "$response_file"
          grep -q 'st_feifeidu_001' "$response_file"
          send_response_file="$(mktemp)"
          curl --fail --silent --show-error --location \
            --retry 5 --retry-all-errors --retry-delay 3 --max-time 60 \
            --request POST \
            --header "Content-Type: application/json" \
            --header "Accept: application/json, text/event-stream" \
            --data '{"jsonrpc":"2.0","id":24,"method":"tools/call","params":{"name":"send_sticker","arguments":{"sticker_id":"st_feifeidu_001"}}}' \
            "https://${PROJECT_ID}.supabase.co/functions/v1/sticker-mcp/mcp" \
            --output "$send_response_file"
          grep -q 'st_feifeidu_001' "$send_response_file"
          grep -Fq '![表情包](' "$send_response_file"
          grep -q '"mimeType":"image/jpeg"' "$send_response_file"

      - name: Verify send_sticker tool call
        if: steps.secrets.outputs.ready == 'true'
        run: |
          response_file="$(mktemp)"
          curl --fail --silent --show-error --location \
            --retry 5 --retry-all-errors --retry-delay 3 --max-time 60 \
            --request POST \
            --header "Content-Type: application/json" \
            --header "Accept: application/json, text/event-stream" \
            --data '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"send_sticker","arguments":{"sticker_id":"st_whitecat_001"}}}' \
            "https://${PROJECT_ID}.supabase.co/functions/v1/sticker-mcp/mcp" \
            --output "$response_file"
          grep -q 'st_whitecat_001' "$response_file"
          grep -q 'structuredContent' "$response_file"
          grep -Fq '![表情包](' "$response_file"

      - name: Verify mobile widget fallback endpoint
        if: steps.secrets.outputs.ready == 'true'
        run: |
          response_file="$(mktemp)"
          curl --fail --silent --show-error --location \
            --retry 5 --retry-all-errors --retry-delay 3 --max-time 45 \
            "https://${PROJECT_ID}.supabase.co/functions/v1/sticker-mcp/widget-data?sticker_id=st_whitecat_001" \
            --output "$response_file"
          grep -q 'st_whitecat_001' "$response_file"
          grep -q '/storage/v1/object/public/stickers/imports/whitecat/' "$response_file"

      - name: Verify widget resource metadata
        if: steps.secrets.outputs.ready == 'true'
        run: |
          response_file="$(mktemp)"
          curl --fail --silent --show-error --location \
            --retry 5 --retry-all-errors --retry-delay 3 --max-time 45 \
            --request POST \
            --header "Content-Type: application/json" \
            --header "Accept: application/json, text/event-stream" \
            --data '{"jsonrpc":"2.0","id":4,"method":"resources/read","params":{"uri":"ui://sticker-mcp/sticker-v4.html"}}' \
            "https://${PROJECT_ID}.supabase.co/functions/v1/sticker-mcp/mcp" \
            --output "$response_file"
          grep -q 'https://web-sandbox.oaiusercontent.com' "$response_file"
          grep -q "https://${PROJECT_ID}.supabase.co" "$response_file"
          grep -q 'ui/initialize' "$response_file"
          grep -q 'ui/notifications/initialized' "$response_file"
          grep -q 'ui/notifications/size-changed' "$response_file"
          grep -q 'notifyIntrinsicHeight' "$response_file"
          grep -q 'setWidgetState' "$response_file"
          grep -q 'widgetState' "$response_file"
          grep -q 'ResizeObserver' "$response_file"
          grep -q 'widget-data?sticker_id=' "$response_file"

      - name: Verify cached widget URI compatibility
        if: steps.secrets.outputs.ready == 'true'
        shell: bash
        run: |
          for resource_uri in \
            'ui://sticker-mcp/sticker.html' \
            'ui://sticker-mcp/sticker-v2.html' \
            'ui://sticker-mcp/sticker-v3.html' \
            'ui://sticker-mcp/sticker-v4.html'; do
            response_file="$(mktemp)"
            payload="$(jq -nc --arg uri "$resource_uri" \
              '{jsonrpc:"2.0",id:41,method:"resources/read",params:{uri:$uri}}')"
            curl --fail --silent --show-error --location \
              --retry 5 --retry-all-errors --retry-delay 3 --max-time 45 \
              --request POST \
              --header "Content-Type: application/json" \
              --header "Accept: application/json, text/event-stream" \
              --data "$payload" \
              "https://${PROJECT_ID}.supabase.co/functions/v1/sticker-mcp/mcp" \
              --output "$response_file"
            grep -q "$resource_uri" "$response_file"
            grep -q 'text/html;profile=mcp-app' "$response_file"
          done
