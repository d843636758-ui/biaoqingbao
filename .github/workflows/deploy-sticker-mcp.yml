name: Deploy Sticker MCP

on:
  push:
    branches:
      - main
    paths:
      - "supabase/**"
      - "tools/**"
      - ".github/workflows/deploy-sticker-mcp.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-sticker-mcp-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROJECT_ID: cqoevridrpdgqjyiksok
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check deployment secrets
        id: secrets
        shell: bash
        run: |
          if [[ -z "$SUPABASE_ACCESS_TOKEN" || -z "$SUPABASE_DB_PASSWORD" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Supabase deployment is prepared but paused. Add SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD in GitHub Actions secrets, then run this workflow again."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Link Supabase project
        if: steps.secrets.outputs.ready == 'true'
        run: supabase link --project-ref "$PROJECT_ID"

      - name: Apply database migrations
        if: steps.secrets.outputs.ready == 'true'
        run: supabase db push

      - name: Import sticker URL batches
        if: steps.secrets.outputs.ready == 'true'
        shell: bash
        run: |
          api_keys_json="$(supabase projects api-keys \
            --project-ref "$PROJECT_ID" --reveal --output json)"
          service_role_key="$(jq -er \
            '.[] | select(.name == "service_role") | .api_key' \
            <<<"$api_keys_json")"
          echo "::add-mask::$service_role_key"
          SUPABASE_SERVICE_ROLE_KEY="$service_role_key" \
            python3 tools/import_url_batch.py

      - name: Deploy Edge Function
        if: steps.secrets.outputs.ready == 'true'
        run: supabase functions deploy sticker-mcp --project-ref "$PROJECT_ID"

      - name: Verify public image
        if: steps.secrets.outputs.ready == 'true'
        run: |
          curl --fail --silent --show-error --location \
            --retry 5 --retry-all-errors --max-time 30 \
            "https://${PROJECT_ID}.supabase.co/storage/v1/object/public/stickers/funny/control.png" \
            --output /tmp/control.png
          test -s /tmp/control.png
          curl --fail --silent --show-error --location \
            --retry 5 --retry-all-errors --max-time 30 \
            "https://${PROJECT_ID}.supabase.co/storage/v1/object/public/stickers/imports/dog26/st_dog26_012.png" \
            --output /tmp/imported-sticker.png
          test -s /tmp/imported-sticker.png

      - name: Verify Edge Function health endpoint
        if: steps.secrets.outputs.ready == 'true'
        run: |
          curl --fail --silent --show-error --location \
            --retry 8 --retry-all-errors --retry-delay 3 --max-time 30 \
            "https://${PROJECT_ID}.supabase.co/functions/v1/sticker-mcp"

      - name: Verify MCP initialize handshake
        if: steps.secrets.outputs.ready == 'true'
        run: |
          response_file="$(mktemp)"
          curl --fail --silent --show-error --location \
            --retry 5 --retry-all-errors --retry-delay 3 --max-time 45 \
            --request POST \
            --header "Content-Type: application/json" \
            --header "Accept: application/json, text/event-stream" \
            --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"github-actions-smoke-test","version":"1.0.0"}}}' \
            "https://${PROJECT_ID}.supabase.co/functions/v1/sticker-mcp/mcp" \
            --output "$response_file"
          grep -Eq '"protocolVersion"|"serverInfo"' "$response_file"

      - name: Verify search_stickers tool call
        if: steps.secrets.outputs.ready == 'true'
        run: |
          response_file="$(mktemp)"
          curl --fail --silent --show-error --location \
            --retry 5 --retry-all-errors --retry-delay 3 --max-time 45 \
            --request POST \
            --header "Content-Type: application/json" \
            --header "Accept: application/json, text/event-stream" \
            --data '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"search_stickers","arguments":{"query":"气呼呼，真的生气了","emotion":"生气","tone":"气呼呼","limit":5}}}' \
            "https://${PROJECT_ID}.supabase.co/functions/v1/sticker-mcp/mcp" \
            --output "$response_file"
          grep -q 'st_dog28_006' "$response_file"

      - name: Verify send_sticker tool call
        if: steps.secrets.outputs.ready == 'true'
        run: |
          response_file="$(mktemp)"
          curl --fail --silent --show-error --location \
            --retry 5 --retry-all-errors --retry-delay 3 --max-time 60 \
            --request POST \
            --header "Content-Type: application/json" \
            --header "Accept: application/json, text/event-stream" \
            --data '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"send_sticker","arguments":{"sticker_id":"st_dog26_012"}}}' \
            "https://${PROJECT_ID}.supabase.co/functions/v1/sticker-mcp/mcp" \
            --output "$response_file"
          grep -q 'st_dog26_012' "$response_file"
          grep -q 'structuredContent' "$response_file"

      - name: Verify widget resource metadata
        if: steps.secrets.outputs.ready == 'true'
        run: |
          response_file="$(mktemp)"
          curl --fail --silent --show-error --location \
            --retry 5 --retry-all-errors --retry-delay 3 --max-time 45 \
            --request POST \
            --header "Content-Type: application/json" \
            --header "Accept: application/json, text/event-stream" \
            --data '{"jsonrpc":"2.0","id":4,"method":"resources/read","params":{"uri":"ui://sticker-mcp/sticker.html"}}' \
            "https://${PROJECT_ID}.supabase.co/functions/v1/sticker-mcp/mcp" \
            --output "$response_file"
          grep -q '"domain"' "$response_file"
          grep -q "https://${PROJECT_ID}.supabase.co" "$response_file"
